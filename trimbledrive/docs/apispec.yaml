  /spaces/{spaceId}/files/{fileId}/versions:
    get:
      tags:
        - Files
      summary: List File Versions
      description: "List all versions of a given file. Pagination is supported."
      operationId: listFileVersions
      parameters:
        - name: spaceId
          in: path
          description: The filespace identifier.
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          description: The file identifier.
          required: true
          schema:
            type: string
        - name: fields
          in: query
          required: false
          explode: false
          description: Option to specify fields to be included in the response.
          schema:
            type: array
            items:
              type: string
              enum:
                - downloadUrl
                - name
                - size
                - parentFolderId
                - topActiveParentFolderId
        - name: deleted
          in: query
          description: "If specified and true, resource is returned even if it is marked as deleted. Otherwise 404 error returned for deleted resource."
          required: false
          schema:
            type: boolean
            default: false
        - name: skipToken
          in: query
          description: "Optimized cursor to fetch items. `skipToken` represents a position in the queried collection. \
            If not provided, first page of results will be returned."
          required: false
          schema:
            type: string
        - name: top
          in: query
          description: "Maximum amount of items to return in the response. <br/>It is\
            \ not guaranteed that exact number of items will be returned, but up to\
            \ the provided value as max. <br/>The maximum value for this parameter is\
            \ **`10000`** and the default value will be same as the maximum value. <br/> If requested number of items exceeds the limit **10000**, then\
            \ the request will fail with an error message. <br/>Note that max items limit might\
            \ be increased in the future, clients should not make any assumptions on the number of items returned by default."
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 10000
            default: 10000
        - name: orderBy
          in: query
          description: "Ordering by specific field for returned items. Items are default ordered by version.\
            Default order is ascending. The syntax would be **`orderBy=fieldName asc|desc `**.<br/>\
            Valid example values: **`version`**, **`version asc`**, **`version desc`**.<br/>\
            Sorting by the following fields **`createdOn`**, **`modifiedOn`**, **`version`** are supported in a performant way. \
            Sorting by other fields are also supported but might NOT be performant."
          required: false
          explode: false
          schema:
            type: string
        - name: from
          in: query
          description: "From version filter criteria.The value can be either full version (e.g. “1.1“) or only the major version (e.g. “1” or “1.*”) in the url"
          required: false
          schema:
            type: string
        - name: to
          in: query
          description: "To version filter criteria.The value can be either full version (e.g. “1.1“) or only the major version (e.g. “1” or “1.*”) in the url"
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFileVersionDetailsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      title: "The error response."
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "The error code. A non-empty language-independent string."
        message:
          type: string
          description: A human-readable string describing the error. The `Content-Language` header MUST contain the language code from [RFC5646](https://docs.oasis-open.org/odata/odata-json-format/v4.01/odata-json-format-v4.01.html#rfc5646) corresponding to the language in which the value for message is written.
    CreateFileSpaceRequest:
      type: object
      properties:
        id:
          type: string
          description: The identifier for a new file space can be given in the request.Only url-safe characters are allowed.The id has to be unique and cannot be updated after creation. If id is not specified service will generate unique id.
          maximum: 128
        description:
          type: string
          description: The description of the file space.
          maximum: 1024
        enforceSafeNames:
          type: boolean
          description: Option to manage file and folder naming restrictions of a file space. By default, naming restrictions will be enabled. Setting this as **`false`** during file space creation will turn OFF the naming restriction for the file space.
    FileSpaceUpdateRequest:
      type: object
      properties:
        description:
          type: string
          description: The description of the file space.
          maximum: 1024
    FileSpaceDetails:
      type: object
      required:
        - id
        - rootId
        - clock
        - createdOn
        - createdBy
        - modifiedOn
        - modifiedBy
        - enforceSafeNames
      properties:
        id:
          type: string
          description: The globally unique identifier of the file space.
        rootId:
          type: string
          description: Root folder identifier.
        description:
          type: string
          description: The description of the file space.
        deleted:
          type: boolean
          description: Indicates whether the space is in the deleted state. If space is deleted, the content of the space is not accessible.
        createdOn:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        modifiedOn:
          type: string
          format: date-time
          readOnly: true
        modifiedBy:
          type: string
          readOnly: true
        changeToken:
          type: string
          description: The change token that represents a state of the space and all it's content (resources in the space) at specific moment of time when this resource has been returned.  Can be used for fetching the changes after this moment of time in incremental synchronisation scenarios by passing this token to `ListChanges` API. The change in the value of this token means something has been changed in the space.
        enforceSafeNames:
          type: boolean
          description: Option to manage file and folder naming restrictions of a file space. By default, naming restrictions will be enabled. Setting this as **`false`** during file space creation will turn OFF the naming restriction for the file space.
    CreateFolderRequest:
      title: "CreateFolderRequest"
      required:
        - "parentFolderId"
        - "name"
      type: "object"
      properties:
        id:
          type: string
          description: The identifier for a new folder can be given in the request. The id has to be unique in the file space and cannot be updated after creation. If id is not specified service will generate unique id.
          maxLength: 128
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        parentFolderId:
          type: "string"
          minLength: 1
          maxLength: 128
    UpdateFolderRequest:
      title: "UpdateFolderRequest"
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "The new name."
        parentFolderId:
          type: "string"
          minLength: 1
          maxLength: 128
          description: "The new parent folder identifier"
    FolderDetailsResponse:
      type: object
      required:
        - id
        - version
        - type
        - spaceId
        - createdBy
        - modifiedBy
        - createdOn
        - modifiedOn
      properties:
        id:
          type: string
        version:
          type: string
          pattern: '^([1-9]\d*)\.0$'
        parentFolderId:
          type: string
          description: Folder identifier of the parent folder. Not present for root folder or for files not attached to any folder (attachments).
        name:
          type: string
        type:
          type: string
          enum:
            - FOLDER
        spaceId:
          type: string
        size:
          type: integer
          format: int64
        createdBy:
          type: string
        modifiedBy:
          type: string
        createdOn:
          type: string
          format: date-time
        modifiedOn:
          type: string
          format: date-time
        deleted:
          type: boolean
        topActiveParentFolderId:
          type : string
          description: Id of the topmost parent folder which is not in deleted state. Normally this will be equal to space `rootFolderId` for not deleted resources and equal to `null` (missing in the response) for deleted resources. If this property is not `null` and not equal to space `rootFolderId` then this resource belongs to orphan subtree with not deleted resources that is not connected to the space root folder.
