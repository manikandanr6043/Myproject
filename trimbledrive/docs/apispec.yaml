          in: query
          description: "If specified and true, in cases of deleted given folder (`folderId`), given folder state will be ignored and children marked as deleted will be also included into response. \
            By default, this is **`false`**, and in case of deleted folder (`folderId`), **`404 FolderNotFound`** will be returned \
            and children marked as deleted will be excluded in the response"
          required: false
          schema:
            type: boolean
            default: false
        - name: skipToken
          in: query
          description: "Optimized cursor to fetch items. `skipToken` represents a position in the queried collection. \
            If not provided, first page of results will be returned."
          required: false
          schema:
            type: string
        - name: top
          in: query
          description: "Maximum amount of items to return in the response. <br/>It is\
            \ not guaranteed that exact number of items will be returned, but up to\
            \ the provided value as max. <br/>The maximum value for this parameter is\
            \ **`10000`** and the default value will be same as the maximum value. <br/> If requested number of items exceeds the limit **10000**, then\
            \ the request will fail with an error message. <br/>Note that max items limit might\
            \ be increased in the future, clients should not make any assumptions on the number of items returned by default."
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 10000
            default: 10000
        - name: orderBy
          in: query
          description: "Ordering by specific field for returned items. Items are default ordered by created datetime.\
            Default order is descending. The syntax would be **`orderBy=fieldName asc|desc `**.<br/>\
            Valid example values: **`createdOn`**, **`createdOn asc`**, **`createdOn desc`**. <br/>\
            Sorting by the following fields **`createdOn`**, **`modifiedOn`** are supported in a performant way. \
            Sorting by other fields are also supported but might NOT be performant for folders with large number of children."
