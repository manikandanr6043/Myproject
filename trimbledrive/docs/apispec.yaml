  /spaces/{spaceId}/uploads:
    post:
      tags:
        - Files
      summary: File upload
      description: "Package upload operation, Along with main (so called 'source') file content, this operation \
        allows to upload representation formats attached to the main file content, e.g. `TRB`, `PDF`, `THUMBNAIL` etc.\
        The `THUMBNAIL` content is treated in a special way (All file APIs provide thumbnailUrl in response \
        which refers to the content stored as `THUMBNAIL`),all other contents are just stored as is.\
        You can use Get File Upload Details API to check the upload status. Please make sure to upload the object \
        only once to each `uploadUrl` (except failed uploads need to be retried using the same uploadUrl to tolerate \
        transient network errors). If several successful uploads are executed to the the same `uploadUrl`,\
        the random content from one of the uploads will be picked up for the permanent storage.\
        Refer examples on how to upload only the main file or main file along with content."
      operationId: initiateFileUpload
      parameters:
        - name: spaceId
          in: path
          description: filespace ID
          required: true
          schema:
            type: string
        - name: urlExpiryInMins
          in: query
          description: Number of minutes for which the pre-signed upload URL for the file will be valid.
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 720
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: If this header is passed with value `*` in the request the upload
            will fail if there is already file with same id/name exists in the same parent folder
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
            examples:
              UploadMainFileOnly:
                value:
                  parentFolderId: "e28982f5-ebd8-4a76-97f4-0783fc143f30"
                  name: "FileName.ext"
              UploadMainFileWithContent:
                value:
                  parentFolderId: "e28982f5-ebd8-4a76-97f4-0783fc143f30"
                  name: "FileName.ext"
                  contents:
                    - format: "THUMBNAIL"
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "202":
          description: ACCEPTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
