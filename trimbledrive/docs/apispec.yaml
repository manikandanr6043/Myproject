---
openapi: 3.0.1
info:
  title: Trimble Drive API
  description: |-
    The service provides capabilities for managing files in the context of Connected Data Environment
    serving the Industry Clouds needs.
    A "file" is an unstructured blob of information with set of standard and custom metadata attributes.

    **PRIOR TO USING THIS API, YOU MUST AGREE TO OUR [TERMS OF USE](https://connect.trimble.com/terms_of_service.html)**

    # Main Capabilities

    * Managing hierarchical file structures (files organized in to hierarchies with folders)
        * The "file" is an unstructured BLOB content with the metadata end user usually expects from the familiar
    "file" concept
        * File hierarchies are organized as "file spaces" to provide logical isolation. The file spaces can be visible
    to end users or completely hidden and used by internal systems to manage unstructured data/files
    * Basic file and folder operations: create/upload, move/rename, delete, copy
        * hierarchical/recursive operations (e.g. delete folder) are implemented asynchronously
        * concurrency control on all operations including upsert, insert-only and update-only semantics
    * Strict versioning for files and folders. All changes are trackable and addressable. User is able to see the
    state of the full folder structure as it was at any moment of the history. User is able to refer to any specific
    version of the file.
        * The monotonically increasing version number for any change made to the file or folder on the server
    (even those not visible to the user).
        * Separate tracking of the changes in files *content*, so user can easily see if new version of the file
    related to change in metadata or in the content.
        * Deletion operations only marks resource as "deleted", but the resource is still accessible to consumer
    using history APIs
    * Large content support with multi-part upload
        * single part uploads support files with content up to 5GB
    * Export and import folder operations as archives
        * import operations can be e.g. used as a batch operation to create a folder/file structure from template.
    * Representation formats attached to files (including thumbnails support as a "first citizen").
        * Client provided representations as well as server side assimilation.
    * File naming convention enforcement based in ISO 19650
    * Malware scanning for file content
    * Access control: TODO what kind of AC model? Access control can be defined in following terms:
        * subjects: TID users, TID applications
        * subject assertions: user groups and roles, account members and roles,
        * objects: folders, files with hierarchical inheritance
    * Special file attributes: checkout (protection) status
    * Custom metadata
    * Sync capabilities for occasionally connected clients
    * Push WebSocket user level notifications for online clients
    * Integration with the Trimble Search Engine to include file metadata and custom metadata to the global search
    * Integration with Trimble Processing Framework to access files from jobs
    * Integration with Trimble Eventing

    # Authentication

    Trimble Connect APIs can be accessed using the following steps:
     1. Register an application with Trimble ID
     2. Get a Trimble ID Access Token
     3. Use the Trimble ID Access Token

    ## Step 1: Register an application with Trimble ID

    This is a one time step.

    ### External integrators:

    Please register your application by following the instructions at
    [https://connect.trimble.com/integrator-sign-page](https://connect.trimble.com/integrator-sign-page).
    With this information, we will register your application, subscribe it to the needed APIs, and then share back a
    **Consumer Key** and **Consumer secret** you will use to authenticate with Trimble ID and the Trimble Connect API.

    ### Trimble-internal integrators:

    You can register your application with the Trimble ID via self-service at
    [Cloud console](https://console.trimble.com/)

    ## Step 2: Get a Trimble ID Access Token

    Implement authentication with an OAuth 2.0 client component using the Authorization Code grant type.
    See the Trimble Connect [Authentication Guide](https://community.trimble.com/viewdocument/
    trimble-connect-authentication-guid) for details.

    ## Step 3: Use the Trimble ID Access token

    To use the public Trimble Connect APIs, you will need to add the **Authorization** header to your requests.
    Replace **access_token** with the actual value you received from **Step 2**.
     `Authorization: Bearer access_token`

    # Regional Endpoints
    The service offers regional endpoints that you can use to make your requests. The resources in each region are
    independent of similar resources in other regions.

    # Common Concepts

    In most cases, this API uses HTTPS requests with JSON-formatted content in requests and responses.

    ## Cross-Origin Resource Sharing

    This API features Cross-Origin Resource Sharing (CORS) implemented in compliance with the
    [W3C spec](https://www.w3.org/TR/cors/) that allows cross-domain communication from the browser.
    All responses have a wildcard same-origin which makes them completely public and accessible to everyone,
    including any code on any site.

    ## Date Format

    All dates in the API use UTC and are strings in the [ISO 8601 combined date and time representation
    format](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations)
    Example `2015-05-15T15:50:38.311Z`.

    ## Folder Path Format

    Paths are strings made up of directory names like (`/directory/abc/`).

    * File paths are subject to the following constraints.
      * directory and file names cannot contain `\`, `.` or a space
      * file path cannot contain `:`, `?`, `<`, `>`, `*`, `|`
      * file names and directories must be less then 255 characters
      * names cannot be `com<1-9>` or `lpt<1-9>` `con`, `nul`, `prn`, `aux` (case insensitive).
    including the name followed by a file extension ex.` aux.txt`
      * cannot contain control characters with integer representation 1-31
      * cannot contain null character with integer representation 0

    _Note_: File and Folder naming constraints can be configured at the space level. During the space creation user can specify whether naming restrictions need to be enforced or not.
    Once set during the space creation, this setting can never be updated later. By default, restrictions will be enabled.

    ## Eventual Read Consistency

    The API responses are eventually consistent.
    When you read data from the service, the response might not reflect the results of the most recently completed
    write operation. The response might include some stale data due to caching
    in place. If you repeat your read request after a short time, the response should return the latest data.

    ## Paginated Responses

    All endpoints that return collection of resources follow the same schema for query parameters and
    response structure to paginate the results.
    Pagination allows to limit the size of the large responses and aimed to improve the responsiveness and overall
    performance when fetching large result sets. The overall latency is improved
    by parallelization of data processing and transfer.

    Pagination is cursor-based and client-driven. The requests accept `skipToken` and `top` query parameters.

    If the `skipToken` query parameter is not specified, first page of the result set is returned.

    The `top` parameter informs the server on how many items client
    wants to receive in a single page. Server returns the requested number of items
    if they are available or less (for the last page in the result set).
    If `top` parameter is not specified then server return maximum page size by default.

    The maximum page size is different for each endpoint and specified as part of the endpoint
    description. If the `top` parameter is greater than endpoint can support server
    will return error to help client avoid bug in pagination implementation.

    ## Common Query Parameters

    In addition to query parameters (`top`, `skipToken`) used for paging responses there are several query
    parameters that are commonly used across all APIs.

    * `deleted` - this query parameter is used to work with resources marked as "deleted". The default APIs
    (except APIs that access specific versions) behavior is to respond with 404 error when resource marked as deleted
    is requested (or don't return deleted resource as part of the listing/find API). If this parameter is specified
    then deletion marker will be ignored and all resources are returned.
    * `fields` - query parameter allow to specify what additional resource properties should be returned in the
    response. By default service returns minimum set of resource properties for optimum performance.

    # Data Model

    ## File space

    The conceptual data model exposed by service consist of following resources: file space, files and folders.
    The file space is a logical container for files and folders. It is a unit of horizontal scalability and mechanism
    of the isolation for group of resources.
    Files and folders are two types of objects than belong to the file space. In this sense the file space can be
    thought as a collection of objects (files and folders).
    File space is a scope for search, synchronization and notification mechanisms. For scalability reasons service
    does not provide such mechanisms on a global scope.

    All API operations work in the file space context (file space identifier is always part of the request).

    ## File, folders, operations, versioning

    Files and folders as objects in the file space have number of attributes (properties).
    Many properties are common (like name, access control lists, creation and modification timestamps, size, etc).
    This is reflected in API surface as common operations and data models.
    But there are also attributes and operations that are applicable only for specific type of the object
    (e.g. content and representation formats, checkout status are applicable only to files).

    ## Identification

    File spaces, files and folders are identifiable resources.
    The identifier is an opaque string. The identifier can be given by the client when resource is created or
    assigned by the service automatically.
    In later case service uses a randomly generated GUID.

    Identifiers given to resources by clients allow easy correlation of file service resources with external resources.
    E.g. in the project files use case a file space can be created with the same identifier as `projectId`.

    The file space identifier must be globally unique.
    Objects (file and folder) identifiers must be unique in the scope of the file space. File and folder in the same
    file space cannot have same identifiers.

    ## Versioning

    Both files and folders are strictly versioned.
    To identify specific versions of the resources a `version` property is used in combination with the
    resource identifier.

    The `version` property is automatically generated by the service, it is a monotonically increasing number.
    The Trimble Drive resource versioning model uses the approach similar to semantic versioning used in the software development.
    The “major version” component is used to indicate the change in the content of the file.
    The “minor version” component indicates a change in any resource attribute other than content.
    When new content is uploaded it always increments the “major version” and resets the “minor version” to “0”.
    This approach allows to evolve the resource in two dimensions and e.g. make a change in the older (not latest) version of the resource
    by “releasing” increment in a minor version.

    Not all mutation operations make sense on older (not latest) versions. Following operations are allowed only on the latest version:
    - Deletion or restore of the file
    - Uploading new content

    The “name” (AKA “rename”) and the “parentFolderId” (AKA “move”) attributes are special in a way that constraints are enforced on them for the “latest” version.
    For the versions these constraints are NOT enforced and we can allow the changes in these attributes as in any other custom attributes.

    Note that the versioning behaves different for folders, the major version gets incremented each time when a folder is reamned, moved or deleted.
    Also there is no support for patching a old version incase of folder resource.

    Each file space uses internal "clock" to order all the changes in the scope of the space.
    This mechanism is used to enable ordering of events in the scope of file space and for implementing synchronization capability for occasionally connected clients.
    Changes and events between file spaces are NOT ordered enabling a horizontal scalability.

    The "custom metadata" is not versioned together with the file/folder it is attached to.
    This allows to classify/add attirbutes to the file without changing it's version.
    E.g. approver can "approve" a file by attaching a needed metadata attribute to the file version without
    changing the file version.

    Changing ACL or "rules" also does not change the file version.

    Data that is not versioned together with the file (custom metadata, ACL, rules) has it's own metadata
    that captures the timestamp and who has changed tit last time.

    ## Async Operations

    Some of the operation like delete, export, undelete folder are performed asynchronously.
    Such APIs are grouped separately in this document.
    Clients are requested to make use of the job details API to get status of these ASYNC API requests.

    ## System Metadata

    The properties service supports in addition to actual file content is referred to as "metadata".
    Service supports usual file metadata like name, size, timestamps, reference to originator of the change, etc.
    Also thumbnail is supported as a first class citizen.

    Service supports following special attributes with special business logic applied.
    * Check in/out
    * Representation formats

    # Error Handling

    ## Handling Errors and Retry Logic

    Common HTTP Response Status Codes are used.
    The response body for all error responses are in the same format and include the error code and message.

    When you send requests to and get responses from the Service API, you might encounter two types of API errors
    * __Client errors__ - Client errors are indicated by a 4xx HTTP response code. Client errors indicate
    that the service found a problem with the client request. This can include such things as an authentication
    failure or missing required parameters. Fix the issue in the client application before submitting the request again.
    * __Server errors__ - Server errors are indicated by a 5xx HTTP response code and need to be resolved by Trimble.
    You may resubmit/retry the request until it succeeds.

    For each API error, the API Gateway returns the following values
    * A status code, for example, `400`
    * An error code, for example, `ValidationException`
    * An error message, for example, `Supplied AttributeValue is empty, must contain exactly one of the
    supported data types`

    ## Error Codes (Client and Server Errors)

    HTTP status codes indicate whether an operation is successful or not.
    A response code of 2xx indicates that the operation was successful. Other error codes indicate either a
    client error (4xx) or a server error (5xx).
    The error table lists the errors returned by the service. Some errors are resolved if you retry the same request.
    As a general rule, the timeout errors, network errors, throttling errors, and 5xx errors may be retried.
    The 401 error code usually indicates expired credentials and should be retried after refreshing the access token.
    The error table indicates which errors are likely to be resolved with successive retries.

    If the value of the Retry column is
    * __Yes__ - Submit the same request again.
    * __Yes if idempotent__ - Submit the same request again, but only if the given method has been
    implemented with idempotence.
    * __No__ - Fix the problem on the client-side before submitting a new request.

    For more information about retrying requests, see Error Retries and Exponential Backoff.

    | HTTP Status Code | Error code                            | Retry                                             |
    | ---------------- | ------------------------------------- | ------------------------------------------------- |
    | 400              |  Bad Request Exception                | No                                                |
    | 401              |  Unauthorized Exception               | No, could be retried after acquiring a new token  |
    | 403              |  Access Denied Exception              | No                                                |
    | 404              |  Not Found Exception                  | No                                                |
    | 409              |  Conflict Exception                   | No                                                |
    | 422              |  Unprocessable Entity Exception       | No                                                |
    | 429              |  Too Many Requests Exception          | Yes                                               |
    | 500              |  Internal Service Failure Exception   | Yes                                               |
    | 502              |  Bad Gateway Exception                | Yes if idempotent                                 |
    | 503              |  Service Unavailable Exception        | Yes                                               |
    | 504              |  Endpoint Request Timed-out Exception | Yes if idempotent                                 |

    ## Catching Errors

    For your application to run smoothly, you need to build in logic to catch and respond to errors.
    One typical approach is to implement your request within a try block or if-then statement.
    The client-side SDKs typically perform retries and error checking out of the box.

    The error code and description are always send in the request response body in addition to HTTP status code.
    To troubleshoot the problem please capture the request identifier using the `X-Trimble-RefId`, `X-Azure-Ref`, `x-amzn-RequestId` HTTP response headers. Inform the value received in these headers to support team.

    ## Error Retries and Exponential Backoff

    Numerous components on a network, such as DNS servers, switches, load balancers,
    and others can generate errors anywhere in the life of a given request.

    The usual technique for dealing with these error responses in a networked environment
    is to implement retries in the client application.
    This technique increases the reliability of the application and reduces operational costs for the developer.

    Official Trimble Connect SDKs implement automatic retry logic. There is also configuration available
    to change the retry settings.

    If you're not using the official SDKs, you should retry original requests that receive server errors (5xx).
    However, client errors (4xx, other than a TooManyRequestsException) indicate you need to
    revise the request itself to correct the problem before trying again.

    In addition to simple retries, it is recommended to use an exponential backoff algorithm for better flow control.
    The idea behind exponential backoff is to use progressively longer waits between retries
    for consecutive error responses.
    For example, you might let one second elapse
    before the first retry, four seconds before the second retry, 16 seconds before the third retry, and so on.
    However, if the request has not succeeded after a minute, the problem might be a hard limit and not the
    request rate.
    For example, you may have reached the maximum number of pipelines allowed. Set the maximum
    number of retries to stop around one minute.

    # Payload compression

    The service accepts `gzip` and `br` compressed request payloads. The `Content-Encoding` header must be sent in the request
    to decode the request payload properly.

    The service supports the following content encodings for responses:
    * `gzip`
    * `br`
    * `identity`

    Only responses larger than 1KB might be encoded. Small responses are sent without encoding.

    The encoding (compression) method can be negotiated with the `Accept-Encoding` header.
    The following `Accept-Encoding` header formats, according to the [RFC 7231](https://tools.ietf.org/html/
    rfc7231#section-5.3.4) specification, are supported:
    * `Accept-Encoding:br,gzip`
    * `Accept-Encoding:` - If the Accept-Encoding header is present and empty, only the unencoded content is acceptable.
    * `Accept-Encoding:*` - This is the default value if the header is not present. This directive does not suggest that any algorithm is supported but indicates that no preference is expressed. Service will decide on the best compression method.
    * `Accept-Encoding:br;q=0.5,gzip=1.0`
    * `Accept-Encoding:gzip;q=1.0,identity;q=0.5,*;q=0`
    If the header is not set, the default value is `*` as defined in RFC 7231. In such cases,
    the payload is compressed with best supported compression method.

    # Limits

    The service has the following limitations:
    * Maximum number of versions of all files and folders in a single file space: 1M.
    * Maximum file/folder name length: 255 characters
    * Maximum full path length: no limits?
    * Maximum depth of the folder hierarchy: no limits
    * Maximum number of items in a single folder: no limits
    * Allowed characters in folder and file names: Unicode except NUL, " * / : < > ? \ |
    * Maximum content length for single part upload: 5GB
    * Single part length for multi-part upload: 5MB - 5GB
    * Id property maximum length: 128 characters. Only url-safe characters are allowed:
    ALPHA  DIGIT  "-" / "." / "_" / "~"
    * Maximum number of custom metadata on a single file: ?
    * Maximum length of a custom metadata name: 64 characters
    * Maximum length of a custom metadata value: 128 characters
    * Maximum number of representation formats attached to the file (including thumbnail): 5
    * Maximum length of a custom role name: 255 characters
    * Maximum number of custom roles in a filespace: 25?
    * Maximum size of `THUMBNAIL` content: 5Mb
    * Maximum number of file upload contents (excluding main file): 5
    * Maximum expiry time of pre-signed upload and download urls : 12 hours
    * Minimum expiry time of pre-signed upload and download urls : 1 minute

