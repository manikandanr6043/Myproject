tags:
  - name: Filespace
  - name: Folders
  - name: Files
paths:
  /spaces:
    post:
      tags:
        - Filespace
      summary: Create Filespace
      description: "This API creates a new filespace. If identifier is provided as part of the request it will be assigned to new filespace on creation otherwise service will generate a new random identifier.\
                  \ By default only creator has access to all data in the filespace. <br>\
                  _Note that a special/root folder with the same name as filespace will be created internally during filespace creation, this folder acts as the parent folder for all the items in the filespace. Root folder details can be accessed just like any other folder by supplying the identifier, there will not be any parent for this folder._ "
      operationId: createFileSpace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileSpaceRequest'
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: The filespace with the same identifier already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSpaceDetails'
  /spaces/{spaceId}:
    get:
      tags:
        - Filespace
      summary: Get Filespace details
      description: "Get FileSpace Details"
      operationId: getFileSpace
      parameters:
        - name: spaceId
          in: path
          description: Filespace identifier
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSpaceDetails'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Filespace
      summary: Update filespace details
      description: "Update FileSpace Details"
      operationId: updateFileSpace
      parameters:
        - name: spaceId
          in: path
          description: Filespace identifier
          required: true
          schema:
            type: string
        - name: deleted
          in: query
          description: "If specified and true, resource is updated (and undeleted) even if it is marked as deleted. Otherwise 404 error returned for deleted resource."
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileSpaceUpdateRequest'
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSpaceDetails'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Filespace
      summary: Delete filespace
      description: "Mark the space as deleted. After this content of the space become not accessible. The space and it's content is not physically deleted immediately and can be restored. The space id stays reserved."
      operationId: deleteFileSpace
      parameters:
        - name: spaceId
          in: path
          description: Filespace identifier
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /spaces/{spaceId}/folders:
    post:
      tags:
        - "Folders"
      summary: "Create Folder"
      description: "You can create a new folder using this action."
      operationId: "createFolder"
      parameters:
        - name: spaceId
          in: path
          description: filespace ID
          required: true
          schema:
            type: string
        - name: fields
          in: query
          description: "Option to specify fields to be returned in the response. The minimum set of required fields are  returned by default for optimum performance."
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - size
                - parentFolderId
                - topActiveParentFolderId
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
        required: true
      responses:
        "201":
          description: "Created"
          headers:
            ETag:
              description: "Weak ETag that can be used for the concurrency control."
              schema:
                type: "string"
            Location:
              description: "The location of a created resource."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetailsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /spaces/{spaceId}/folders/{folderId}:
    get:
      tags:
        - Folders
      summary: Get Folder Details
      description: "Get Folder details for a given folder identifier. By default, this operation returns `404 NotFound` in case of folder not present or if the resource is in deleted state, this default behavior can be modified with the `deleted` query parameter. <br/>\
                    To fetch a specific version information, optional query parameter `version` can be specified. Specific version information will be returned regardless of the deletion state."
      operationId: getFolderDetails
      parameters:
        - name: spaceId
          in: path
          description: filespace ID
          required: true
          schema:
            type: string
        - name: folderId
          in: path
          required: true
          schema:
            type: string
        - name: deleted
          in: query
          description: "If specified and true, resource is returned even if it is marked as deleted. Otherwise 404 error returned for deleted resource."
          required: false
          schema:
            type: boolean
            default: false
        - name: fields
          in: query
          description: "Option to specify fields to be returned in the response. The minimum set of required fields are  returned by default for optimum performance."
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - size
                - parentFolderId
                - topActiveParentFolderId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDetailsResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - "Folders"
      summary: "Move/Rename Folder"
      description: "You can use this API to move/rename the Folder.\n\nTo move a folder,\
